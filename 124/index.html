<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Moving to the Netherlands - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Moving to the Netherlands — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Moving to the Netherlands", "level": "B1", "questions": [{"question": "Wat vond Sanne een beetje stressvol?", "options": ["De verhuizing naar Nederland", "Het zoeken naar een fiets", "Het leren van de taal", "Het vinden van een supermarkt"], "correct_index": 0, "explanation": "She found the move to the Netherlands a bit stressful."}, {"question": "Wat heeft Sanne al gedaan met betrekking tot de taal?", "options": ["Ze is een taalcursus begonnen", "Ze heeft Nederlandse boeken gekocht", "Ze praat dagelijks Nederlands", "Ze heeft een vriend gevonden die Nederlands spreekt"], "correct_index": 0, "explanation": "Sanne has started her first language lessons."}, {"question": "Waarom is het belangrijk om een goed fietsslot te hebben?", "options": ["Vanwege fietsendiefstal", "Om snel te kunnen fietsen", "Om de fiets schoon te houden", "Om te voorkomen dat het slot roest"], "correct_index": 0, "explanation": "A good lock is important because bicycle theft can be a problem."}, {"question": "Wat moet Sanne meenemen als ze een bankrekening opent?", "options": ["Haar paspoort", "Haar BSN-nummer", "Geld", "Een fiets"], "correct_index": 1, "explanation": "Maaike advises Sanne to take her BSN number with her."}, {"question": "Wat vindt Maaike geweldig in Nederland?", "options": ["Het eten en de mensen", "De winkels en de markten", "De cultuur en de mensen", "De musea en het weer"], "correct_index": 2, "explanation": "Maaike loves the culture and the people in the Netherlands."}, {"question": "Wat wordt in Nederland als erg handig gezien voor vervoer?", "options": ["Een fiets", "Een OV-chipkaart", "Een auto", "Een scooter"], "correct_index": 1, "explanation": "The OV chip card is considered very handy for transportation."}, {"question": "Wat raadt Maaike aan voor sociale activiteiten?", "options": ["Een bioscoopbezoek", "Een sportclub of een taalcafé", "Een museumtour", "Een fietstocht"], "correct_index": 1, "explanation": "Maaike recommends trying a sports club or a language café."}, {"question": "Wat heeft Sanne op haar to-do lijst voor deze week staan?", "options": ["Een fiets kopen", "Een huis vinden", "Een Nederlandse bankrekening openen", "Een SIM-kaart aanschaffen"], "correct_index": 2, "explanation": "Sanne has opening a Dutch bank account on her to-do list."}, {"question": "Waarom is een regenjas handig volgens Maaike?", "options": ["Het kan plotseling regenen", "Het is modieus", "Het is verplicht", "Het houdt warm"], "correct_index": 0, "explanation": "Maaike mentions that the weather can change suddenly, so a raincoat is handy."}, {"question": "Waar kan Sanne terecht voor vragen over het schoolsysteem?", "options": ["Bij haar buren", "Bij de gemeente", "Bij Maaike", "Bij haar werkgever"], "correct_index": 2, "explanation": "Maaike offers her help if Sanne has questions about the school system."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
