<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Utility Services - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Utility Services — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Utility Services", "level": "B1", "questions": [{"question": "Wat deed Mia toen ze een hogere elektriciteitsrekening kreeg?", "options": ["Ze belde de klantenservice.", "Ze betaalde de rekening meteen.", "Ze veranderde van leverancier.", "Ze schreef een klachtbrief."], "correct_index": 0, "explanation": "Mia called customer service when she received a higher bill."}, {"question": "Wat is volgens Roos een goed advies voor het omgaan met rekeningen?", "options": ["Nooit de rekeningen betalen.", "Altijd weten wat je afschrijft.", "Controleer je modem.", "Verander elk jaar van leverancier."], "correct_index": 1, "explanation": "Roos advises to always keep track of your bills."}, {"question": "Wat vindt Mia het moeilijkst aan waterbedrijven?", "options": ["De klantenservice bereiken.", "Meterstanden doorgeven.", "De tarieven vergelijken.", "De rekeningen begrijpen."], "correct_index": 1, "explanation": "Mia finds submitting meter readings the hardest part."}, {"question": "Hoe geeft Roos meestal haar meterstanden door?", "options": ["Per telefoon.", "Via een app.", "Online.", "Via de post."], "correct_index": 2, "explanation": "Roos usually submits meter readings online."}, {"question": "Wat doet Roos als haar internet uitvalt?", "options": ["Ze belt direct de klantendienst.", "Ze wacht tot het terugkomt.", "Ze reset haar router.", "Ze controleert de modem eerst."], "correct_index": 0, "explanation": "Roos calls the provider right away when her internet goes out."}, {"question": "Hoe vaak controleert Mia voor betere aanbiedingen?", "options": ["Elke maand.", "Nooit.", "Elke week.", "Elk jaar."], "correct_index": 3, "explanation": "Mia compares offers every year."}, {"question": "Wat helpt voor een snellere internetverbinding volgens Roos?", "options": ["Een andere modem.", "Een betere laptop.", "Een andere router.", "Vaker de klantendienst bellen."], "correct_index": 2, "explanation": "Roos found that a different router helped improve their connection."}, {"question": "Wat gebruikt Mia soms voor grote schoonmaakklussen?", "options": ["Een extern bedrijf.", "Een app.", "Haar buurman.", "Een robotstofzuiger."], "correct_index": 0, "explanation": "Mia uses an external company when it's very busy."}, {"question": "Wat is volgens Mia handig bij het boodschappen doen?", "options": ["Zelf naar de supermarkt gaan.", "Online bestellen met bezorging.", "Familie vragen om te gaan.", "Een persoonlijke boodschapper inhuren."], "correct_index": 1, "explanation": "Mia finds delivery routes for online grocery shopping very handy."}, {"question": "Wat heeft Mia één keer meegemaakt met zendingen?", "options": ["Een verloren pakket.", "Een beschadigde zending.", "Een altijd te late bezorging.", "Geen problemen."], "correct_index": 1, "explanation": "Mia once experienced an issue with a damaged shipment."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
