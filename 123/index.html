<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Dutch Integration Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Dutch Integration — Quiz</h1><div class="muted">10 questions • Select one answer for each question.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Submit Quiz</button><button type="button" class="again" id="again">Try Again</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Dutch Integration", "level": "B1", "questions": [{"question": "What did Noor have for lunch?", "options": ["Broodje kaas", "Cappuccino", "Pasta", "Salad"], "correct_index": 0, "explanation": "Noor mentioned having a 'broodje kaas' (cheese sandwich) for lunch."}, {"question": "Which coffee does Fatima usually order?", "options": ["Espresso", "Cappuccino", "Latte Macchiato", "Black Coffee"], "correct_index": 1, "explanation": "Fatima said she usually takes a cappuccino."}, {"question": "Where does Noor live?", "options": ["Amsterdam", "Rotterdam", "Utrecht", "The Hague"], "correct_index": 2, "explanation": "Noor has lived her whole life in Utrecht."}, {"question": "What activity does Fatima find daunting in the Netherlands?", "options": ["Driving", "Cycling", "Swimming", "Walking"], "correct_index": 1, "explanation": "Fatima finds cycling in the Netherlands a bit daunting."}, {"question": "What is Noor's favorite type of coffee?", "options": ["Espresso", "Cappuccino", "Latte Macchiato", "Black Coffee"], "correct_index": 2, "explanation": "Noor's favorite type of coffee is Latte Macchiato."}, {"question": "What does Noor enjoy doing at Griftpark?", "options": ["Swimming", "Playing sports", "Reading books", "Gardening"], "correct_index": 1, "explanation": "Noor enjoys playing sports at Griftpark."}, {"question": "How does Fatima describe the Neude?", "options": ["Quiet", "Cozy", "Remote", "Uncomfortable"], "correct_index": 1, "explanation": "Fatima describes the Neude as 'erg gezellig' (very cozy)."}, {"question": "Which languages does Fatima speak besides Dutch?", "options": ["German and Spanish", "Arabic, French, and a little Spanish", "Italian and French", "English and Spanish"], "correct_index": 1, "explanation": "Fatima speaks Arabic, French, and a little Spanish in addition to Dutch."}, {"question": "What is a recommended tip from Noor to improve Dutch pronunciation?", "options": ["Reading books", "Watching movies", "Listening to the radio", "Singing Dutch songs"], "correct_index": 2, "explanation": "Noor recommends listening to the radio to improve Dutch pronunciation."}, {"question": "Where is Fatima originally from?", "options": ["Turkey", "Morocco", "Spain", "Greece"], "correct_index": 1, "explanation": "Fatima mentions that she is from Morocco."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=q.explanation;});result.style.display='block';result.innerHTML='<strong>Score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Answered: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
