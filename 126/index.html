<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Buying a House - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Buying a House — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Buying a House", "level": "B1", "questions": [{"question": "Hoeveel is Julia van plan uit te geven aan een huis?", "options": ["Tweehonderdduizend euro", "Driehonderdduizend euro", "Vierhonderdduizend euro", "Vijhonderdduizend euro"], "correct_index": 1, "explanation": "Julia mentioned a budget of three hundred thousand euros."}, {"question": "Waarom is Sophie belangrijk om een betrouwbare makelaar te kiezen?", "options": ["Omdat ze goedkoper zijn", "Omdat ze betere huizen hebben", "Omdat ze goede deals kunnen vinden", "Omdat ze het proces versnellen"], "correct_index": 2, "explanation": "A reliable estate agent can find good deals as suggested by Sophie."}, {"question": "Welke buurt vindt Sophie charmant?", "options": ["De Pijp", "Rivierenbuurt", "Jordaan", "Oud-Zuid"], "correct_index": 1, "explanation": "Sophie mentioned finding the Rivierenbuurt charming."}, {"question": "Welke extra kosten moet Julia overwegen bij een ouder huis?", "options": ["Verzekering", "Onderhoudskosten", "Registratiekosten", "Transportkosten"], "correct_index": 1, "explanation": "Sophie advised Julia to consider maintenance costs, especially for older houses."}, {"question": "Wat wordt er tijdens een bouwkundige inspectie gedaan?", "options": ["De waarde van het huis bepaald", "De juridische status gecontroleerd", "De staat van het huis gecontroleerd", "De hypotheekmogelijkheden besproken"], "correct_index": 2, "explanation": "A structural inspection involves checking the condition of the house."}, {"question": "Waarom zou Julia een advocaat willen inschakelen?", "options": ["Voor financiële adviezen", "Voor juridische zaken", "Voor een lagere prijs", "Voor marketingadvies"], "correct_index": 1, "explanation": "Hiring a lawyer is wise for legal matters, according to Sophie."}, {"question": "Wat kan een hypotheekadviseur voor Julia doen?", "options": ["De waarde van het huis inschatten", "De goedkoopste huizen vinden", "De beste hypotheekopties vinden", "Het papierwerk doen"], "correct_index": 2, "explanation": "Sophie suggests a mortgage advisor can find the best mortgage options."}, {"question": "Waarom zijn ontbindende voorwaarden belangrijk?", "options": ["Ze bieden financiële voordelen", "Ze zijn juridisch vereist", "Ze dienen als een soort verzekering", "Ze verminderen de koopprijs"], "correct_index": 2, "explanation": "Cancellation conditions act like insurance in case something goes wrong."}, {"question": "Waarom overweegt Julia energiezuinige apparaten?", "options": ["Ze zijn goedkoper", "Ze zijn beter voor het milieu", "Ze zijn moderner", "Ze hebben een betere garantie"], "correct_index": 1, "explanation": "Julia wants energy-efficient appliances because they are better for the environment."}, {"question": "Wat heeft Julia nog op haar to-dolijst staan?", "options": ["De hypotheekaanvraag", "De inspectie plannen", "De verzekeringen", "De makelaar kiezen"], "correct_index": 2, "explanation": "Julia mentioned that insurance is still on her to-do list."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
