<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Neighbour Conversations - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Neighbour Conversations — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Neighbour Conversations", "level": "B1", "questions": [{"question": "Wat heeft Mia gekocht bij de nieuwe winkel?", "options": ["Een nieuwe lamp", "Een schilderij", "Een t-shirt", "Een plant"], "correct_index": 0, "explanation": "Mia kocht een nieuwe lamp voor haar woonkamer."}, {"question": "Wat voor soort lamp heeft Mia gekocht?", "options": ["Een tafellamp", "Een wandlamp", "Een moderne staande lamp met houten voet", "Een plafonnière"], "correct_index": 2, "explanation": "Mia beschrijft de lamp als een moderne staande lamp met een houten voet."}, {"question": "Waarom overweegt Roos om naar de nieuwe winkel te gaan?", "options": ["Ze wil nieuwe kleding", "Er is een openingskorting", "Ze heeft een cadeaukaart", "Ze wil koffie drinken"], "correct_index": 1, "explanation": "Roos overweegt te gaan omdat er een openingskorting is."}, {"question": "Wat is het plan voor de nieuwe buurman?", "options": ["Hem negeren", "Hem helpen verhuizen", "Hem uitnodigen voor koffie", "Hem een cadeau geven"], "correct_index": 2, "explanation": "Roos en Mia willen de nieuwe buurman uitnodigen voor koffie."}, {"question": "Waar denkt Roos dat ze haar telefoon heeft verloren?", "options": ["In de supermarkt", "Op het werk", "In de auto", "Op een concert"], "correct_index": 0, "explanation": "Roos denkt dat ze haar telefoon in de supermarkt heeft verloren."}, {"question": "Naar welk evenement gaat Mia vanavond?", "options": ["Een bioscoop", "Een concert", "Een museum", "Een sportwedstrijd"], "correct_index": 1, "explanation": "Mia gaat vanavond naar een concert van een lokale band."}, {"question": "Welke bloemen wil Mia in haar tuin planten?", "options": ["Tulpen en rozen", "Zonnebloemen en lavendel", "Daisies en lelies", "Viooltjes en narcissen"], "correct_index": 1, "explanation": "Mia wil zonnebloemen en lavendel planten in haar tuin."}, {"question": "Wat is het nieuwe project van Mia op haar werk?", "options": ["Een nieuwe website", "Een magazine", "Een app voor reizigers", "Een reclamecampagne"], "correct_index": 2, "explanation": "Het nieuwe project is een app ontwikkelen die reizigers helpt goedkope vluchten te vinden."}, {"question": "Naar welke locaties gaat Mia op vakantie?", "options": ["Barcelona, Madrid, en Valencia", "Amsterdam, Rotterdam, en Den Haag", "Londen, Manchester, en Liverpool", "Rome, Florence, en Venetië"], "correct_index": 3, "explanation": "Mia gaat naar Rome, Florence, en Venetië op vakantie."}, {"question": "Wat is er met Mia's fiets gebeurd?", "options": ["De ketting is gebroken", "De band is lek", "Het stuur is los", "Het zadel is verdwenen"], "correct_index": 1, "explanation": "Mia's fiets heeft een lekke band."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
