<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Renting a House - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Renting a House — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Renting a House", "level": "B1", "questions": [{"question": "Waarom wil Tessa verhuizen?", "options": ["Haar huidige kamer is te groot.", "Haar huidige kamer is te klein.", "Ze heeft een huis gekocht.", "Ze wil in een andere stad wonen."], "correct_index": 1, "explanation": "Tessa's huidige kamer is te klein geworden."}, {"question": "Wat voor woning zoekt Tessa?", "options": ["Een studio", "Een appartement met drie slaapkamers", "Een appartement met twee slaapkamers", "Een vrijstaand huis"], "correct_index": 2, "explanation": "Tessa zoekt een appartement met twee slaapkamers."}, {"question": "Hoeveel euro wil Tessa maximaal per maand aan huur uitgeven?", "options": ["800 euro", "1500 euro", "1200 euro", "1000 euro"], "correct_index": 2, "explanation": "Tessa's budget is maximaal 1200 euro per maand."}, {"question": "Wat is belangrijk voor Tessa als ze iets huurt?", "options": ["Een tuin", "Inclusieve huurprijs", "Dicht bij het station", "Twee badkamers"], "correct_index": 1, "explanation": "Tessa wil dat de huurprijs inclusief is."}, {"question": "Welke websites heeft Lotte aanbevolen aan Tessa?", "options": ["Marktplaats en Speurders", "Funda en Pararius", "Airbnb en Booking", "Koopwoningen en HuizenTel"], "correct_index": 1, "explanation": "Lotte raadt Funda en Pararius aan."}, {"question": "Wat wil Tessa meenemen naar bezichtigingen?", "options": ["Een camera", "Een notitieblok", "Een meetlint", "Een zaklamp"], "correct_index": 1, "explanation": "Lotte raadt aan een notitieblok mee te nemen voor aantekeningen."}, {"question": "Wat is een slimme strategie volgens Lotte bij het onderhandelen over de huurprijs?", "options": ["Meer bieden dan gevraagd", "De verkoper negeren", "Minder bieden als het lang te huur staat", "De prijs accepteren zonder onderhandelen"], "correct_index": 2, "explanation": "Lotte zegt minder te bieden als het lang te huur staat."}, {"question": "Hoeveel tijd heeft Tessa om te verhuizen?", "options": ["Een week", "Twee maanden", "Een maand", "Drie weken"], "correct_index": 2, "explanation": "Tessa heeft een maand om te verhuizen."}, {"question": "Wat wil Tessa graag als huisdier?", "options": ["Een hond", "Een vis", "Een kat", "Een konijn"], "correct_index": 2, "explanation": "Tessa zou graag een kat willen."}, {"question": "Wat moet Tessa volgens Lotte niet vergeten tijdens bezichtigingen?", "options": ["Vragen stellen", "Verhuizen", "Een verzekering afsluiten", "Een aanbeveling vragen"], "correct_index": 0, "explanation": "Lotte zegt dat het belangrijk is om vragen te stellen tijdens bezichtigingen."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
