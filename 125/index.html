<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Renting a House - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Renting a House — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Renting a House", "level": "B1", "questions": [{"question": "Wat is het maximale budget dat Lotte per maand wil uitgeven aan huur?", "options": ["800 euro", "900 euro", "1000 euro", "750 euro"], "correct_index": 0, "explanation": "Lotte mentioned she does not want to spend more than 800 euros per month."}, {"question": "Welke online platforms raadt Tessa aan voor het zoeken naar een huis?", "options": ["Marktplaats en Facebook", "Santander en Global", "Funda en Pararius", "Airbnb en Expedia"], "correct_index": 2, "explanation": "Tessa recommended Funda and Pararius as popular websites."}, {"question": "Waarom wil Lotte dichtbij haar werk wonen?", "options": ["Omdat ze graag loopt", "Omdat ze geen auto wil gebruiken", "Omdat ze vroeg moet opstaan", "Omdat ze van drukte houdt"], "correct_index": 1, "explanation": "Lotte stated that she does not want to use a car."}, {"question": "Wat moet Lotte doen tijdens een bezichtiging volgens Tessa?", "options": ["Het huis direct reserveren", "Foto's maken van elke kamer", "De makelaar betalen", "Observeren en vragen stellen"], "correct_index": 3, "explanation": "Tessa advised to observe the environment and ask questions."}, {"question": "Welke zaken moet Lotte controleren bij de verzekering?", "options": ["Dekking voor brand en inbraak", "Dekking voor waterschade en storm", "Dekking voor glasbreuk", "Dekking voor vandalisme"], "correct_index": 0, "explanation": "Tessa mentioned checking for coverage for fire and burglary."}, {"question": "Hoeveel borg moet Lotte meestal betalen?", "options": ["Één maand huur", "Twee maanden huur", "Drie maanden huur", "Geen borg"], "correct_index": 0, "explanation": "Lotte specified that the deposit is usually one month's rent."}, {"question": "Waar moet Lotte zich registreren na de verhuizing?", "options": ["Bij de bank", "Bij de politie", "Bij de gemeente", "Bij de verhuurder"], "correct_index": 2, "explanation": "Tessa informed Lotte that she must register at the municipality."}, {"question": "Wat kan Lotte doen om een betere huurprijs te krijgen?", "options": ["Niets, de prijs staat vast", "Proberen te onderhandelen", "Direct kopen", "Verhuizen naar een andere stad"], "correct_index": 1, "explanation": "Tessa suggested that it's common to negotiate the rental price in the Netherlands."}, {"question": "Wat raadt Tessa aan voor het kopen van meubels met een beperkt budget?", "options": ["Nieuwe winkels", "Tweedehands winkels", "Online platforms", "Eigen meubels maken"], "correct_index": 1, "explanation": "Tessa recommended second-hand stores for good deals on furniture."}, {"question": "Waar kan Lotte verhuisdozen vinden volgens Tessa?", "options": ["Bij de bibliotheek", "Bij supermarkten en winkels", "In het park", "Bij het buurhuis"], "correct_index": 1, "explanation": "Tessa advised Lotte to ask at supermarkets and stores for moving boxes."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
