<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Useful Dutch Sentences for Household Problems - Nederlandse quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero,.q,.result{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.hero{margin-bottom:16px}.brand{font-weight:800;color:#1f5eff}.hero h1{margin:8px 0}.q{margin:14px 0}.opt{display:block;border:1px solid #d9e0e7;border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f8fafc}.correct{border-color:#15803d;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{display:none;margin-top:9px;font-size:14px;color:#475569}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.submit{background:#1f5eff;color:#fff}.again{display:none;background:#111827;color:#fff;margin-left:8px}.result{display:none;margin-top:18px}.muted{color:#64748b}
</style></head><body><div class="wrap">
<div class="hero"><div class="brand">FluentNL</div><h1>100 Useful Dutch Sentences for Household Problems — Nederlandse quiz</h1><div class="muted">10 vragen • Kies één antwoord per vraag.</div></div>
<form id="quiz"></form><button type="button" class="submit" id="submit">Antwoorden versturen</button><button type="button" class="again" id="again">Opnieuw proberen</button>
<div id="result" class="result"></div></div>
<script>
const DATA={"title": "FluentNL Quiz", "topic": "100 Useful Dutch Sentences for Household Problems", "level": "B1", "questions": [{"question": "Waarom heeft Fleur de lekkende kraan nog niet gerepareerd?", "options": ["Ze weet niet hoe ze het moet doen.", "Ze heeft geen tijd gehad.", "Ze heeft geen zin om het te doen.", "Ze heeft geen spullen om het te repareren."], "correct_index": 0, "explanation": "Fleur zegt dat ze niet precies weet hoe ze het moet doen."}, {"question": "Wat biedt Eva aan Fleur aan om het kraanprobleem te helpen oplossen?", "options": ["Een moersleutel.", "Een hamer.", "Een nieuwe kraan.", "Een loodgieter."], "correct_index": 0, "explanation": "Eva vraagt of Fleur een moersleutel nodig heeft."}, {"question": "Waarom denkt Eva dat de lamp in de gang blijft flikkeren?", "options": ["Vanwege de elektrische bedrading.", "Omdat de lamp kapot is.", "Vanwege een oude schakelaar.", "Omdat de stroom is uitgevallen."], "correct_index": 0, "explanation": "Eva zegt dat het aan de elektrische bedrading kan liggen."}, {"question": "Wat heeft Fleur geprobeerd tegen de verstopte afvoer?", "options": ["Een ontstoppingsmiddel.", "Een loodgieter bellen.", "Niets, ze heeft het probleem genegeerd.", "Kokend water."], "correct_index": 0, "explanation": "Fleur zegt dat ze al een ontstoppingsmiddel heeft geprobeerd."}, {"question": "Wat veroorzaakt lawaai bij de wasmachine van Fleur?", "options": ["Mogelijk een verstopt filter.", "De motor is kapot.", "De wasmachine is niet waterpas.", "Er zit een kledingstuk vast."], "correct_index": 0, "explanation": "Eva suggereert dat het een verstopt filter kan zijn."}, {"question": "Welke oplossing stelt Eva voor tegen de schimmel in de badkamer?", "options": ["Een sterker schoonmaakmiddel.", "Regelmatig de badkamer sluiten.", "De badkamer vaker gebruiken.", "Weinig ventilatie hebben."], "correct_index": 0, "explanation": "Eva denkt dat een sterker antischimmelmiddel nodig kan zijn."}, {"question": "Wat denkt Eva dat Fleur moet doen om problemen met haar koelkast op te lossen?", "options": ["De afvoerbuis controleren.", "Een nieuwe koelkast kopen.", "De koelkast vaker schoonmaken.", "De koelkast minder vol maken."], "correct_index": 0, "explanation": "Eva vraagt of Fleur de afvoerbuis heeft gecontroleerd."}, {"question": "Waarom stelt Fleur het grote onderhoudsbeurt van haar huis steeds uit?", "options": ["Omdat het veel tijd en geld kost.", "Omdat ze het vergeet.", "Omdat ze het niet nodig vindt.", "Omdat ze geen hulp heeft."], "correct_index": 0, "explanation": "Fleur zegt dat het veel tijd en geld kost."}, {"question": "Wat ontdekt Eva over de tuinschimmel en wat te gebruiken?", "options": ["Kopertape gebruiken.", "Een nieuw type mest.", "Extra water geven.", "Meer zonlicht geven."], "correct_index": 0, "explanation": "Eva stelt voor kopertape rondom de planten te gebruiken."}, {"question": "Wat zegt Fleur over de snelheid van grasgroei in haar tuin?", "options": ["Het groeit sneller dan ze kan maaien.", "Het groeit erg langzaam.", "Het groeit niet meer.", "Het is net gekapt."], "correct_index": 0, "explanation": "Fleur zegt dat het gras sneller groeit dan ze kan maaien."}]};const form=document.getElementById('quiz'),result=document.getElementById('result');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){form.innerHTML='';DATA.questions.forEach((q,qi)=>{const box=document.createElement('div');box.className='q';box.dataset.q=qi;let h='<h3>'+(qi+1)+'. '+esc(q.question)+'</h3>';q.options.forEach((o,oi)=>{h+='<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+esc(o)+'</label>';});h+='<div class="feedback"></div>';box.innerHTML=h;form.appendChild(box);});result.style.display='none';document.getElementById('again').style.display='none';document.getElementById('submit').style.display='inline-block';}
document.getElementById('submit').onclick=()=>{let score=0,answered=0;DATA.questions.forEach((q,qi)=>{const box=form.querySelector('[data-q="'+qi+'"]'),picked=box.querySelector('input:checked'),labels=[...box.querySelectorAll('.opt')];labels.forEach(x=>x.classList.remove('correct','wrong'));if(picked){answered++;const v=Number(picked.value);if(v===q.correct_index){score++;labels[v].classList.add('correct');}else{labels[v].classList.add('wrong');labels[q.correct_index].classList.add('correct');}}else{labels[q.correct_index].classList.add('correct');}const fb=box.querySelector('.feedback');fb.style.display='block';fb.textContent=(picked&&Number(picked.value)===q.correct_index?'Goed! ':'Juiste antwoord: '+q.options[q.correct_index]+'. ')+q.explanation;});result.style.display='block';result.innerHTML='<strong>Jouw score: '+score+' / '+DATA.questions.length+'</strong><br><span class="muted">Beantwoord: '+answered+' / '+DATA.questions.length+'</span>';document.getElementById('again').style.display='inline-block';document.getElementById('submit').style.display='none';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
document.getElementById('again').onclick=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};render();
</script></body></html>
